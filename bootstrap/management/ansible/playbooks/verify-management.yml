---
- name: Verify the management laptop bootstrap
  hosts: management
  become: false
  gather_facts: false

  tasks:
    - name: Check installed tool versions
      ansible.builtin.command:
        argv:
          - "{{ item }}"
          - --version
      loop:
        - git
        - ansible
        - terraform
        - packer
      changed_when: false

    - name: Verify outbound HTTPS access to GitHub
      ansible.builtin.uri:
        url: https://github.com
        method: HEAD
        status_code: 200
        timeout: 15

    - name: Check whether the runner is registered
      ansible.builtin.stat:
        path: "{{ github_runner_directory | default('/opt/actions-runner') }}/.runner"
      register: runner_registration

    - name: Report runner registration state
      ansible.builtin.assert:
        that:
          - runner_registration.stat.exists
        fail_msg: >-
          The management tools are installed, but the GitHub runner is not
          registered. Run register-github-runner.yml.

    - name: Read the GitHub runner service name
      ansible.builtin.slurp:
        src: "{{ github_runner_directory | default('/opt/actions-runner') }}/.service"
      become: true
      register: runner_service_file

    - name: Check the GitHub runner service is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ runner_service_file.content | b64decode | trim }}"
      become: true
      changed_when: false

    - name: Check the GitHub runner service starts at boot
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ runner_service_file.content | b64decode | trim }}"
      become: true
      changed_when: false
